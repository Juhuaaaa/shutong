[project]
name = "shutong"
version = "0.2.1"
description = "漫画与轻小说自动整理：识别、Bangumi 元数据写入、Kavita 联动"
requires-python = ">=3.12"
dependencies = [
    "Pillow>=11",
    "pypdf>=5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13",
    "python-multipart>=0.0.9",
    "pysocks>=1.7",
    "numpy>=2",
    "libarchive-c>=5; sys_platform == 'win32'",
    "send2trash>=1.8",
]

[project.scripts]
shutong = "shutong.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pyflakes>=3",
    "libarchive-c>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shutong"]
